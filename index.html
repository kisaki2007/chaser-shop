<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaos Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/pricedown" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0a0a0c;
            color: #ffffff;
            padding: 20px 16px 90px 16px;
            position: relative;
            min-height: 100vh;
        }

        /* Симметричный фон с узором и свечением */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: 
                radial-gradient(circle at 50% 0%, rgba(255, 215, 0, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 50% 100%, rgba(255, 170, 0, 0.12) 0%, transparent 45%),
                linear-gradient(rgba(255, 215, 0, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 215, 0, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            background-position: center top, center bottom, center center, center center;
            pointer-events: none;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 42px;
            font-weight: 400;
            font-family: 'Pricedown Bl', 'Pricedown', sans-serif;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        /* Навигация (Вкладки) */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background: rgba(24, 24, 31, 0.8);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #888;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ffd700 0%, #d4af37 100%);
            color: #000;
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Товары - Симметричная сетка */
        .products-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            max-width: 900px;
            margin: 0 auto;
        }

        .product-card {
            flex: 0 1 calc(50% - 8px); /* 2 колонки на мобилках */
            max-width: 220px; /* Ограничение на ПК */
            background: linear-gradient(145deg, rgba(24, 24, 31, 0.9), rgba(17, 17, 22, 0.9));
            backdrop-filter: blur(10px);
            border-radius: 18px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .product-card:active {
            transform: scale(0.97);
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .img-container {
            width: 100%;
            height: 130px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            padding: 8px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .product-card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .stock-badge {
            font-size: 11px;
            font-weight: 700;
            color: #2ecc71;
            background: rgba(46, 204, 113, 0.15);
            padding: 4px 10px;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        .product-card h3 {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .product-card .price {
            font-weight: 800;
            color: #ffd700;
            font-size: 16px;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .btn-add {
            width: 100%;
            background: linear-gradient(135deg, #ffd700 0%, #d4af37 100%);
            color: #000000;
            border: none;
            padding: 12px 0;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.25);
        }

        /* Корзина */
        .cart-container {
            max-width: 450px;
            margin: 0 auto;
            background: rgba(24, 24, 31, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item-info {
            text-align: left;
            flex-grow: 1;
        }

        .cart-item-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .cart-item-price {
            font-size: 13px;
            color: #ffd700;
            font-weight: 600;
        }

        .cart-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-qty {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
            border: 1px solid #ffd700;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-qty:active {
            background: #ffd700;
            color: #000;
        }

        .cart-total-box {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed rgba(255, 215, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
            font-size: 18px;
        }

        /* Уведомление */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(15, 15, 19, 0.95);
            border: 1px solid #ffd700;
            color: #ffffff;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            z-index: 2000;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.2);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* Модальные окна */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            padding: 20px;
        }

        .modal-card {
            background: linear-gradient(145deg, #18181f, #111116);
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            padding: 30px 24px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.15);
        }

        /* Симметричная форма */
        .form-group {
            width: 100%;
            margin-bottom: 16px;
            text-align: center;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #ffd700;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 14px;
            color: #fff;
            font-size: 14px;
            text-align: center;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }

        .form-input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #888;
            padding: 12px 0;
            width: 100%;
            border-radius: 12px;
            margin-top: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cancel:active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        @media (max-width: 360px) {
            .product-card {
                flex: 0 1 100%;
            }
        }
    </style>
</head>
<body>

    <div class="bg-pattern"></div>

    <h1>Chaos Shop</h1>

    <div class="nav-tabs">
        <button id="tab-btn-catalog" class="tab-btn active" onclick="switchTab('catalog')">Каталог</button>
        <button id="tab-btn-cart" class="tab-btn" onclick="switchTab('cart')">Корзина (<span id="tab-cart-count">0</span>)</button>
    </div>

    <!-- Вкладка Каталог -->
    <div id="catalog-tab" class="tab-content active">
        <div id="products-container" class="products-grid"></div>
    </div>

    <!-- Вкладка Корзина -->
    <div id="cart-tab" class="tab-content">
        <div class="cart-container">
            <h2 style="margin-bottom: 20px; font-weight: 800;">Ваша корзина</h2>
            <div id="cart-items-list"></div>
            <div id="cart-empty-msg" style="color: #666; padding: 30px 0; font-weight: 600;">Корзина пока пуста 🛒</div>
            <div id="cart-summary" style="display: none;">
                <div class="cart-total-box">
                    <span>Итого:</span>
                    <span id="cart-total-price" style="color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);">0 PLN</span>
                </div>
                <button onclick="openDeliveryModal()" class="btn-add" style="margin-top: 20px;">Оформить заказ 🚀</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Добавлено в корзину ✨</div>

    <!-- Приветственное окно -->
    <div id="welcome-modal" class="modal-overlay" style="display: flex;">
        <div class="modal-card">
            <h2 style="margin-bottom: 12px; font-size: 26px;">Приветствуем! ✨</h2>
            <p style="font-size: 15px; color: #c0c0d0; margin-bottom: 20px; line-height: 1.5;">
                Добро пожаловать в <b>Chaos Shop</b>!<br>Лучшие вкусы ждут вас.
            </p>
            <div style="background: rgba(255, 215, 0, 0.05); border: 1px dashed rgba(255, 215, 0, 0.5); padding: 10px; border-radius: 12px; margin-bottom: 24px; color: #ffd700; font-weight: 700; letter-spacing: 1px;">
                Made with love by D & N 🖤
            </div>
            <button onclick="closeModal('welcome-modal')" class="btn-add">Войти в магазин ♡</button>
        </div>
    </div>

    <!-- Форма доставки -->
    <div id="delivery-modal" class="modal-overlay">
        <div class="modal-card">
            <h2 style="margin-bottom: 20px; font-size: 24px;">Доставка 📦</h2>
            
            <div class="form-group">
                <label>Имя и Фамилия</label>
                <input type="text" id="cust-name" class="form-input" placeholder="Иван Иванов">
            </div>
            <div class="form-group">
                <label>Телефон</label>
                <input type="tel" id="cust-phone" class="form-input" placeholder="+48 000 000 000">
            </div>
            <div class="form-group">
                <label>Адрес / Пачкомат</label>
                <input type="text" id="cust-address" class="form-input" placeholder="Варшава, InPost WAW01M">
            </div>
            
            <button onclick="submitOrder()" class="btn-add" style="margin-top: 10px;">Отправить заказ</button>
            <button onclick="closeModal('delivery-modal')" class="btn-cancel">Вернуться назад</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp || null;

        const products = [
            { id: 1, name: "Chaser Mint", price: 60, stock: 4, img: "mint.jpg" },
            { id: 2, name: "Chaser Grape Plus", price: 60, stock: 3, img: "grape_plus.jpg?v=5" },
            { id: 3, name: "Chaser Watermelon", price: 60, stock: 3, img: "watermelon.jpg" },
            { id: 4, name: "Chaser Energy Raspberry", price: 60, stock: 3, img: "energy_raspberry.jpg" },
            { id: 5, name: "Chaser Pink Lemonade", price: 60, stock: 3, img: "pink_lemonade.jpg" },
            { id: 6, name: "Chaser Triple Berry", price: 60, stock: 4, img: "triple_raspberry.jpg" },
            { id: 7, name: "Chaser Blueberry Mint", price: 60, stock: 3, img: "blueberry_mint.jpg" },
            { id: 8, name: "Chaser Tropic Punch", price: 60, stock: 4, img: "tropic_punch.jpg" },
            { id: 9, name: "Chaser Energy Cherry", price: 60, stock: 4, img: "energy_cherry.jpg" },
            { id: 10, name: "Chaser Pineapple", price: 60, stock: 4, img: "pineapple.jpg" }
        ];

        let cart = {};

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            document.getElementById(`tab-btn-${tab}`).classList.add('active');
            document.getElementById(`${tab}-tab`).classList.add('active');
        }

        function renderProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="img-container">
                        <img src="${p.img}" alt="${p.name}">
                    </div>
                    <div class="stock-badge">${p.stock} шт в наличии ✅</div>
                    <h3>${p.name}</h3>
                    <p class="price">${p.price} PLN</p>
                    <button onclick="addToCart(${p.id})" class="btn-add">В корзину</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const currentQty = cart[id] ? cart[id].qty : 0;

            if (currentQty < product.stock) {
                if (!cart[id]) {
                    cart[id] = { ...product, qty: 1 };
                } else {
                    cart[id].qty++;
                }
                updateCartUI();
                showToast();
            } else {
                alert(`Достигнуто максимальное количество (${product.stock} шт)`);
            }
        }

        function changeQty(id, delta) {
            if (cart[id]) {
                cart[id].qty += delta;
                if (cart[id].qty <= 0) {
                    delete cart[id];
                } else if (cart[id].qty > cart[id].stock) {
                    cart[id].qty = cart[id].stock;
                }
                updateCartUI();
            }
        }

        function updateCartUI() {
            const itemsList = document.getElementById('cart-items-list');
            const cartKeys = Object.keys(cart);
            let totalCount = 0;
            let totalPrice = 0;

            if (cartKeys.length === 0) {
                document.getElementById('cart-empty-msg').style.display = 'block';
                document.getElementById('cart-summary').style.display = 'none';
                itemsList.innerHTML = '';
            } else {
                document.getElementById('cart-empty-msg').style.display = 'none';
                document.getElementById('cart-summary').style.display = 'block';

                itemsList.innerHTML = cartKeys.map(key => {
                    const item = cart[key];
                    totalCount += item.qty;
                    totalPrice += item.price * item.qty;
                    return `
                        <div class="cart-item">
                            <div class="cart-item-info">
                                <div class="cart-item-title">${item.name}</div>
                                <div class="cart-item-price">${item.price} PLN</div>
                            </div>
                            <div class="cart-controls">
                                <button class="btn-qty" onclick="changeQty(${item.id}, -1)">-</button>
                                <span style="font-weight: 700; width: 16px; text-align: center;">${item.qty}</span>
                                <button class="btn-qty" onclick="changeQty(${item.id}, 1)">+</button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('tab-cart-count').innerText = totalCount;
            document.getElementById('cart-total-price').innerText = `${totalPrice} PLN`;
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function openDeliveryModal() {
            document.getElementById('delivery-modal').style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function submitOrder() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const address = document.getElementById('cust-address').value.trim();

            if (!name || !phone || !address) {
                alert('Пожалуйста, заполните все данные доставки!');
                return;
            }

            const orderData = {
                items: Object.values(cart),
                customer: { name, phone, address },
                total: Object.values(cart).reduce((s, i) => s + (i.price * i.qty), 0)
            };

            if (tg) {
                tg.sendData(JSON.stringify(orderData));
            } else {
                alert(`Заказ отправлен!\nПокупатель: ${name}\nТелефон: ${phone}\nАдрес: ${address}`);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            if (tg) {
                try { tg.ready(); tg.expand(); } catch (e) {}
            }
        });
    </script>
</body>
</html>
