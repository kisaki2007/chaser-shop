<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaser Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent-color: #d4af37; /* Black & Gold theme */
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            padding-bottom: 90px;
        }

        h1, h2 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify: space-between;
        }

        .product-card img {
            width: 100%;
            height: 110px;
            object-fit: contain;
            border-radius: 8px;
            background-color: #000;
        }

        .product-title {
            font-size: 14px;
            font-weight: bold;
            margin: 8px 0 4px;
        }

        .product-price {
            color: var(--accent-color);
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        button {
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        /* Корзина и форма */
        .cart-section, .form-section {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-color);
            border-radius: 12px;
            padding: 15px;
            margin-top: 25px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #2a2a2a;
            font-size: 14px;
        }

        .cart-controls button {
            width: 28px;
            height: 28px;
            padding: 0;
            margin: 0 4px;
            display: inline-block;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #000;
            color: #fff;
            box-sizing: border-box;
        }

        .total-price {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-color);
            text-align: right;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>CHASER STORE</h1>

    <div class="products-grid" id="products"></div>

    <div class="cart-section">
        <h2>Корзина</h2>
        <div id="cart-items">
            <p style="text-align: center; color: var(--text-muted);">Корзина пуста</p>
        </div>
        <div class="total-price" id="total-price">Итого: 0 ₴</div>
    </div>

    <div class="form-section">
        <h2>Данные для доставки</h2>
        <div class="input-group">
            <label for="name">Имя и Фамилия</label>
            <input type="text" id="name" placeholder="Иван Иванов">
        </div>
        <div class="input-group">
            <label for="phone">Номер телефона</label>
            <input type="tel" id="phone" placeholder="+380XXXXXXXXX">
        </div>
        <div class="input-group">
            <label for="address">Город и № отделения Новой Почты</label>
            <input type="text" id="address" placeholder="Киев, Отделение №1">
        </div>
        <button id="checkout-btn" style="margin-top: 10px; padding: 12px; font-size: 16px;">Оформить заказ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Продукты с прямой ссылкой на изображения
        const products = [
            {
                id: 1,
                name: "Chaser Black Raspberry",
                price: 300,
                // Используйте прямые HTTPS ссылки на изображения
                img: "https://images.unsplash.com/photo-1577069861033-55d04ace4ef0?w=300" 
            },
            {
                id: 2,
                name: "Chaser Triple Watermelon",
                price: 300,
                img: "https://images.unsplash.com/photo-1589984662646-e7b2e4962f18?w=300"
            }
        ];

        let cart = {};

        function renderProducts() {
            const container = document.getElementById('products');
            container.innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.img}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/150/000000/FFFFFF?text=No+Image'">
                    <div class="product-title">${p.name}</div>
                    <div class="product-price">${p.price} ₴</div>
                    <button onclick="addToCart(${p.id})">В корзину</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            cart[id] = (cart[id] || 0) + 1;
            updateCartUI();
        }

        function changeQty(id, delta) {
            if (cart[id]) {
                cart[id] += delta;
                if (cart[id] <= 0) delete cart[id];
            }
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('total-price');
            const keys = Object.keys(cart);

            if (keys.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Корзина пуста</p>';
                totalEl.innerText = 'Итого: 0 ₴';
                return;
            }

            let total = 0;
            container.innerHTML = keys.map(id => {
                const product = products.find(p => p.id == id);
                const count = cart[id];
                const sum = product.price * count;
                total += sum;
                return `
                    <div class="cart-item">
                        <div>${product.name} x ${count}</div>
                        <div class="cart-controls">
                            <span>${sum} ₴</span>
                            <button onclick="changeQty(${id}, -1)">-</button>
                            <button onclick="changeQty(${id}, 1)">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            totalEl.innerText = `Итого: ${total} ₴`;
        }

        document.getElementById('checkout-btn').addEventListener('click', () => {
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();

            if (Object.keys(cart).length === 0) {
                alert("Ваша корзина пуста!");
                return;
            }
            if (!name || !phone || !address) {
                alert("Пожалуйста, заполните все поля формы доставки!");
                return;
            }

            // Формируем структуру заказа
            const items = Object.keys(cart).map(id => {
                const p = products.find(prod => prod.id == id);
                return { name: p.name, count: cart[id], price: p.price };
            });

            const orderData = {
                customer: { name, phone, address },
                items: items,
                total: items.reduce((acc, item) => acc + (item.price * item.count), 0)
            };

            // Отправляем данные обратно в Telegram Bot
            tg.sendData(JSON.stringify(orderData));
        });

        renderProducts();
    </script>
</body>
</html></html>
