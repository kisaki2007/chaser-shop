<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Vape Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --gold-primary: #d4af37;
            --gold-gradient: linear-gradient(135deg, #f39c12, #d4af37, #f1c40f);
            --text-color: #f5f5f5;
            --text-muted: #a0a0a0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 16px 16px 80px 16px;
        }

        h1 {
            text-align: center;
            font-size: 20px;
            color: var(--gold-primary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .card-title { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
        .card-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
        .card-price { font-size: 15px; color: var(--gold-primary); font-weight: bold; margin-bottom: 10px; }

        .counter {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #262626;
            border-radius: 6px;
            padding: 2px;
        }

        .counter-btn {
            background: var(--gold-primary);
            color: #000;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .counter-val { font-size: 14px; font-weight: bold; }

        /* Фиксированная корзина снизу */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #141414;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.8);
        }

        .cart-info { display: flex; flex-direction: column; }
        .cart-total { color: var(--gold-primary); font-weight: bold; font-size: 16px; }
        .cart-count { color: var(--text-muted); font-size: 12px; }

        .checkout-btn {
            background: var(--gold-gradient);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .checkout-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>GOLD VAPE STORE</h1>

    <div class="products-grid" id="products"></div>

    <div class="cart-bar">
        <div class="cart-info">
            <span class="cart-total" id="total-price">0 ₽</span>
            <span class="cart-count" id="total-count">Товаров: 0</span>
        </div>
        <button class="checkout-btn" id="pay-btn" disabled onclick="submitOrder()">Заказать</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const products = [
            { id: 1, name: "Mango Ice 30ml", desc: "Манго с кулером", price: 850 },
            { id: 2, name: "Berry Mix 30ml", desc: "Лесные ягоды", price: 850 },
            { id: 3, name: "Tobacco Gold 30ml", desc: "Классический табак", price: 900 },
            { id: 4, name: "Grape Mint 30ml", desc: "Виноград и мята", price: 850 }
        ];

        let cart = {};

        function renderProducts() {
            const container = document.getElementById('products');
            container.innerHTML = products.map(p => `
                <div class="card">
                    <div>
                        <div class="card-title">${p.name}</div>
                        <div class="card-desc">${p.desc}</div>
                    </div>
                    <div>
                        <div class="card-price">${p.price} ₽</div>
                        <div class="counter">
                            <button class="counter-btn" onclick="updateCart(${p.id}, -1)">-</button>
                            <span class="counter-val" id="qty-${p.id}">0</span>
                            <button class="counter-btn" onclick="updateCart(${p.id}, 1)">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateCart(productId, change) {
            cart[productId] = (cart[productId] || 0) + change;
            if (cart[productId] <= 0) delete cart[productId];
            
            document.getElementById(`qty-${productId}`).innerText = cart[productId] || 0;
            updateCartSummary();
        }

        function updateCartSummary() {
            let total = 0;
            let count = 0;

            for (const id in cart) {
                const item = products.find(p => p.id == id);
                total += item.price * cart[id];
                count += cart[id];
            }

            document.getElementById('total-price').innerText = `${total} ₽`;
            document.getElementById('total-count').innerText = `Товаров: ${count}`;
            document.getElementById('pay-btn').disabled = count === 0;
        }

        function submitOrder() {
            const orderItems = [];
            let total = 0;

            for (const id in cart) {
                const item = products.find(p => p.id == id);
                orderItems.push({
                    name: item.name,
                    qty: cart[id],
                    price: item.price * cart[id]
                });
                total += item.price * cart[id];
            }

            const payload = {
                items: orderItems,
                total_price: total
            };

            tg.sendData(JSON.stringify(payload));
        }

        renderProducts();
    </script>
</body>
</html>
