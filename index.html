<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaos Shop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --card-bg: #f9f9f9;
      --accent-color: #000000;
      --accent-text: #ffffff;
      --border-color: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
      padding-bottom: 90px;
    }

    h1, h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .catalog {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 30px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    .product-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .product-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .product-price {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }

    .btn-add {
      background: var(--accent-color);
      color: var(--accent-text);
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    /* Секция корзины и формы */
    .cart-section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-top: 20px;
    }

    .cart-items {
      margin-bottom: 12px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
    }

    .cart-controls button {
      background: #e0e0e0;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .cart-total {
      font-weight: 700;
      font-size: 16px;
      text-align: right;
      margin: 12px 0;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
    }

    .btn-checkout {
      background: #000;
      color: #fff;
      border: none;
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    .empty-cart {
      text-align: center;
      color: #888;
      font-size: 14px;
      padding: 10px 0;
    }
  </style>
</head>
<body>

  <h1>CHAOS SHOP</h1>

  <!-- Каталог товаров -->
  <div class="catalog" id="catalog"></div>

  <!-- Корзина и Оформление заказа -->
  <div class="cart-section">
    <h2>Корзина</h2>
    <div id="cart-items" class="cart-items">
      <div class="empty-cart">Корзина пуста</div>
    </div>
    
    <div class="cart-total" id="cart-total">Итого: 0 PLN</div>

    <h2>Доставка</h2>
    <div class="form-group">
      <label>Имя и Фамилия</label>
      <input type="text" id="cust-name" placeholder="Иван Иванов">
    </div>
    <div class="form-group">
      <label>Номер телефона</label>
      <input type="tel" id="cust-phone" placeholder="+48 123 456 789">
    </div>
    <div class="form-group">
      <label>Адрес доставки / Город</label>
      <input type="text" id="cust-address" placeholder="Варшава, ul. Marszałkowska 1">
    </div>

    <button class="btn-checkout" onclick="checkout()">Оформить заказ</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Список 10 товаров
    const products = [
      { id: 1, name: "Energy Drink", price: 15, img: "energy.jpg" },
      { id: 2, name: "Raspberry Energy", price: 15, img: "energy_raspberry.jpg" },
      { id: 3, name: "Snack Box", price: 25, img: "snack.jpg" },
      { id: 4, name: "Choco Bar", price: 10, img: "choco.jpg" },
      { id: 5, name: "Gummy Bears", price: 12, img: "gummy.jpg" },
      { id: 6, name: "Lemonade", price: 14, img: "lemonade.jpg" },
      { id: 7, name: "Crisps Classic", price: 18, img: "crisps.jpg" },
      { id: 8, name: "Coffee Cold", price: 16, img: "coffee.jpg" },
      { id: 9, name: "Matcha Drink", price: 20, img: "matcha.jpg" },
      { id: 10, name: "Water Spark", price: 8, img: "water.jpg" }
    ];

    let cart = {};

    // Рендер каталога
    function renderCatalog() {
      const catalogEl = document.getElementById('catalog');
      catalogEl.innerHTML = '';
      products.forEach(p => {
        catalogEl.innerHTML += `
          <div class="product-card">
            <img src="${p.img}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/150'">
            <div class="product-title">${p.name}</div>
            <div class="product-price">${p.price} PLN</div>
            <button class="btn-add" onclick="addToCart(${p.id})">Добавить</button>
          </div>
        `;
      });
    }

    function addToCart(id) {
      if (cart[id]) {
        cart[id].qty += 1;
      } else {
        const prod = products.find(p => p.id === id);
        cart[id] = { ...prod, qty: 1 };
      }
      renderCart();
    }

    function changeQty(id, delta) {
      if (cart[id]) {
        cart[id].qty += delta;
        if (cart[id].qty <= 0) {
          delete cart[id];
        }
      }
      renderCart();
    }

    function renderCart() {
      const cartEl = document.getElementById('cart-items');
      const totalEl = document.getElementById('cart-total');
      const keys = Object.keys(cart);

      if (keys.length === 0) {
        cartEl.innerHTML = '<div class="empty-cart">Корзина пуста</div>';
        totalEl.innerText = 'Итого: 0 PLN';
        return;
      }

      cartEl.innerHTML = '';
      let total = 0;

      keys.forEach(id => {
        const item = cart[id];
        const sum = item.price * item.qty;
        total += sum;
        cartEl.innerHTML += `
          <div class="cart-item">
            <div>
              <strong>${item.name}</strong><br>
              <small>${item.price} PLN × ${item.qty} = ${sum} PLN</small>
            </div>
            <div class="cart-controls">
              <button onclick="changeQty(${id}, -1)">-</button>
              <span style="margin: 0 6px;">${item.qty}</span>
              <button onclick="changeQty(${id}, 1)">+</button>
            </div>
          </div>
        `;
      });

      totalEl.innerText = `Итого: ${total} PLN`;
    }

    // Главная функция оформления заказа
    function checkout() {
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const address = document.getElementById('cust-address').value.trim();

      const itemsArray = Object.values(cart);

      if (itemsArray.length === 0) {
        alert("Добавьте товары в корзину!");
        return;
      }

      if (!name || !phone || !address) {
        alert("Пожалуйста, заполните все поля доставки (Имя, Телефон, Адрес)!");
        return;
      }

      let totalSum = itemsArray.reduce((acc, item) => acc + (item.price * item.qty), 0);

      const orderPayload = {
        items: itemsArray.map(i => ({ name: i.name, qty: i.qty, price: i.price })),
        total: totalSum,
        customer: { name, phone, address }
      };

      // 1. Отправляем данные в Telegram боту
      tg.sendData(JSON.stringify(orderPayload));

      // 2. Вызываем всплывающее окно
      tg.showPopup({
        title: "Спасибо за заказ! 😊",
        message: "Ваш заказ успешно оформлен. Скоро с вами свяжемся!",
        buttons: [{ type: "ok" }]
      }, function() {
        tg.close(); // Закрываем веб-приложение
      });
    }

    renderCatalog();
  </script>
</body>
</html>
