<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaos Shop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f0f10;
      --card-bg: #1a1a1c;
      --text-color: #ffffff;
      --subtext-color: #a0a0a5;
      --accent-color: #f3c623;
      --accent-hover: #d4a910;
      --border-color: #2a2a2e;
      --input-bg: #121214;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
      padding-bottom: 90px;
    }

    h1, h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 24px;
      color: var(--accent-color);
      margin-top: 10px;
    }

    h2 {
      font-size: 18px;
      margin-top: 15px;
    }

    /* Catalog */
    .catalog {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 30px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    .product-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .product-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .product-price {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-color);
      margin-bottom: 10px;
    }

    .btn-add {
      background: var(--accent-color);
      color: #000000;
      border: none;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-add:active {
      background: var(--accent-hover);
    }

    /* Cart Section */
    .cart-section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 18px;
      margin-top: 20px;
    }

    .cart-items {
      margin-bottom: 12px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
    }

    .cart-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cart-controls button {
      background: #2a2a2e;
      color: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cart-controls button:active {
      background: var(--accent-color);
      color: #000;
    }

    .cart-total {
      font-weight: 800;
      font-size: 18px;
      text-align: right;
      margin: 16px 0;
      color: var(--accent-color);
    }

    /* Form */
    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-color);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 14px;
      background: var(--input-bg);
      color: #ffffff;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--accent-color);
    }

    .btn-checkout {
      background: var(--accent-color);
      color: #000000;
      border: none;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-checkout:active {
      background: var(--accent-hover);
    }

    .empty-cart {
      text-align: center;
      color: var(--subtext-color);
      font-size: 14px;
      padding: 15px 0;
    }
  </style>
</head>
<body>

  <h1>CHAOS SHOP</h1>

  <!-- Каталог товаров -->
  <div class="catalog" id="catalog"></div>

  <!-- Корзина и Оформление заказа -->
  <div class="cart-section">
    <h2>Корзина</h2>
    <div id="cart-items" class="cart-items">
      <div class="empty-cart">Корзина пуста</div>
    </div>
    
    <div class="cart-total" id="cart-total">Итого: 0 PLN</div>

    <h2>Доставка 📦</h2>
    <div class="form-group">
      <label>ИМЯ И ФАМИЛИЯ</label>
      <input type="text" id="cust-name" placeholder="Введите имя">
    </div>
    <div class="form-group">
      <label>ТЕЛЕФОН</label>
      <input type="tel" id="cust-phone" placeholder="+48 ...">
    </div>
    <div class="form-group">
      <label>АДРЕС / ПАЧКОМАТ</label>
      <input type="text" id="cust-address" placeholder="Город, улица, пачкомат">
    </div>

    <button class="btn-checkout" onclick="checkout()">ОТПРАВИТЬ ЗАКАЗ</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Список товаров (можете меняти названия и цены)
    const products = [
      { id: 1, name: "Energy Drink", price: 15, img: "energy.jpg" },
      { id: 2, name: "Raspberry Energy", price: 15, img: "energy_raspberry.jpg" },
      { id: 3, name: "Snack Box", price: 25, img: "snack.jpg" },
      { id: 4, name: "Choco Bar", price: 10, img: "choco.jpg" },
      { id: 5, name: "Gummy Bears", price: 12, img: "gummy.jpg" },
      { id: 6, name: "Lemonade", price: 14, img: "lemonade.jpg" },
      { id: 7, name: "Crisps Classic", price: 18, img: "crisps.jpg" },
      { id: 8, name: "Coffee Cold", price: 16, img: "coffee.jpg" },
      { id: 9, name: "Matcha Drink", price: 20, img: "matcha.jpg" },
      { id: 10, name: "Water Spark", price: 8, img: "water.jpg" }
    ];

    let cart = {};

    function renderCatalog() {
      const catalogEl = document.getElementById('catalog');
      catalogEl.innerHTML = '';
      products.forEach(p => {
        catalogEl.innerHTML += `
          <div class="product-card">
            <img src="${p.img}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/150/1a1a1c/ffffff?text=Chaos+Shop'">
            <div class="product-title">${p.name}</div>
            <div class="product-price">${p.price} PLN</div>
            <button class="btn-add" onclick="addToCart(${p.id})">Добавить</button>
          </div>
        `;
      });
    }

    function addToCart(id) {
      if (cart[id]) {
        cart[id].qty += 1;
      } else {
        const prod = products.find(p => p.id === id);
        cart[id] = { ...prod, qty: 1 };
      }
      renderCart();
    }

    function changeQty(id, delta) {
      if (cart[id]) {
        cart[id].qty += delta;
        if (cart[id].qty <= 0) {
          delete cart[id];
        }
      }
      renderCart();
    }

    function renderCart() {
      const cartEl = document.getElementById('cart-items');
      const totalEl = document.getElementById('cart-total');
      const keys = Object.keys(cart);

      if (keys.length === 0) {
        cartEl.innerHTML = '<div class="empty-cart">Корзина пуста</div>';
        totalEl.innerText = 'Итого: 0 PLN';
        return;
      }

      cartEl.innerHTML = '';
      let total = 0;

      keys.forEach(id => {
        const item = cart[id];
        const sum = item.price * item.qty;
        total += sum;
        cartEl.innerHTML += `
          <div class="cart-item">
            <div>
              <strong>${item.name}</strong><br>
              <small style="color: var(--subtext-color);">${item.price} PLN × ${item.qty} = ${sum} PLN</small>
            </div>
            <div class="cart-controls">
              <button onclick="changeQty(${id}, -1)">-</button>
              <span style="font-weight: bold; min-width: 16px; text-align: center;">${item.qty}</span>
              <button onclick="changeQty(${id}, 1)">+</button>
            </div>
          </div>
        `;
      });

      totalEl.innerText = `Итого: ${total} PLN`;
    }

    function checkout() {
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const address = document.getElementById('cust-address').value.trim();

      const itemsArray = Object.values(cart);

      if (itemsArray.length === 0) {
        if (tg.showAlert) {
          tg.showAlert("Добавьте хотя бы один товар в корзину!");
        } else {
          alert("Добавьте хотя бы один товар в корзину!");
        }
        return;
      }

      if (!name || !phone || !address) {
        if (tg.showAlert) {
          tg.showAlert("Пожалуйста, заполните Имя, Телефон и Адрес доставки!");
        } else {
          alert("Пожалуйста, заполните Имя, Телефон и Адрес доставки!");
        }
        return;
      }

      let totalSum = itemsArray.reduce((acc, item) => acc + (item.price * item.qty), 0);

      const orderPayload = {
        items: itemsArray.map(i => ({ name: i.name, qty: i.qty, price: i.price })),
        total: totalSum,
        customer: { name, phone, address }
      };

      // 1. Отправляем данные в Telegram-бот
      tg.sendData(JSON.stringify(orderPayload));

      // 2. Всплывающее окно подтверждения
      if (tg.showPopup) {
        tg.showPopup({
          title: "Спасибо за заказ! 😊",
          message: "Ваш заказ успешно оформлен. Менеджер скоро свяжется с вами!",
          buttons: [{ type: "ok" }]
        }, function() {
          tg.close();
        });
      } else {
        alert("Спасибо за заказ! 😊");
        tg.close();
      }
    }

    renderCatalog();
  </script>
</body>
</html>
