<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>D&N SHOP</title>

  <!-- Подключение Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    /* ПЕРЕМЕННЫЕ И ОСНОВНЫЕ СТИЛИ */
    :root {
      --bg-color: #0a0a0a;
      --card-bg: #141414;
      --text-color: #ffffff;
      --text-sub: #888888;
      --border-color: #222222;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      overflow-x: hidden;
    }

    /* ПРИВЕТСТВЕННОЕ ОКНО D&N */
    #welcome-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg-color);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    .welcome-box {
      text-align: center;
      padding: 30px;
      max-width: 320px;
      width: 100%;
    }

    .welcome-initials {
      font-family: 'Georgia', serif;
      font-size: 72px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 8px;
    }

    .welcome-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: var(--text-sub);
      margin-bottom: 16px;
    }

    .welcome-desc {
      font-size: 14px;
      color: var(--text-color);
      margin-bottom: 36px;
      line-height: 1.4;
    }

    .btn-welcome {
      background: transparent;
      color: #ffffff;
      border: 1px solid #ffffff;
      padding: 14px 40px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.3s, color 0.3s;
    }

    .btn-welcome:active {
      background: #ffffff;
      color: #000000;
    }

    /* ШАПКА МАГАЗИНА */
    header {
      text-align: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .header-logo {
      font-family: 'Georgia', serif;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .header-sub {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--text-sub);
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* КАТАЛОГ ТОВАРОВ */
    .catalog {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .product-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .product-price {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 12px;
    }

    .btn-add {
      width: 100%;
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-add:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <!-- 1. ВСПЛЫВАЮЩЕЕ ПРИВЕТСТВИЕ D&N -->
  <div id="welcome-modal">
    <div class="welcome-box">
      <div class="welcome-initials">D&N</div>
      <div class="welcome-title">WELCOME TO D&N</div>
      <div class="welcome-desc">Эстетика и качество в каждой детали.</div>
      <button class="btn-welcome" onclick="closeWelcome()">ВОЙТИ</button>
    </div>
  </div>

  <!-- 2. ОСНОВНОЙ ИНТЕРФЕЙС МАГАЗИНА -->
  <header>
    <div class="header-logo">D&N</div>
    <div class="header-sub">STORE</div>
  </header>

  <main>
    <div class="catalog">
      <!-- Пример товара 1 -->
      <div class="product-card">
        <div>
          <div class="product-title">Товар 1</div>
          <div class="product-price">1 000 ₽</div>
        </div>
        <button class="btn-add" onclick="addToCart('Товар 1', 1000)">В КОРЗИНУ</button>
      </div>

      <!-- Пример товара 2 -->
      <div class="product-card">
        <div>
          <div class="product-title">Товар 2</div>
          <div class="product-price">2 500 ₽</div>
        </div>
        <button class="btn-add" onclick="addToCart('Товар 2', 2500)">В КОРЗИНУ</button>
      </div>
    </div>
  </main>

  <!-- 3. ВСЕ СКРИПТЫ И ЛОГИКА -->
  <script>
    // Инициализация Telegram WebApp
    const tg = window.Telegram ? window.Telegram.WebApp : null;

    if (tg) {
      tg.expand(); // Разворачиваем окно на весь экран
      tg.MainButton.textColor = "#FFFFFF";
      tg.MainButton.color = "#222222";
    }

    // Закрытие приветственного окна
    function closeWelcome() {
      const modal = document.getElementById('welcome-modal');
      modal.style.opacity = '0';
      
      setTimeout(() => {
        modal.style.display = 'none';
      }, 500); // Окно плавно исчезает через 0.5 сек
    }

    // Корзина товаров
    let cart = [];

    function addToCart(title, price) {
      cart.push({ title, price });
      updateMainButton();
    }

    function updateMainButton() {
      if (!tg) return;

      if (cart.length > 0) {
        const total = cart.reduce((sum, item) => sum + item.price, 0);
        tg.MainButton.setText(`ОФОРМИТЬ ЗАКАЗ (${total} ₽)`);
        tg.MainButton.show();
      } else {
        tg.MainButton.hide();
      }
    }

    // Отправка заказа в Telegram
    if (tg) {
      tg.onEvent('mainButtonClicked', function() {
        tg.sendData(JSON.stringify(cart));
      });
    }
  </script>
</body>
</html>
