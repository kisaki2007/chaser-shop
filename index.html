<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaser Shop Black Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            padding: 20px 16px 90px 16px;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .product-card {
            background: #111114;
            border-radius: 16px;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid #22222a;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            transition: border-color 0.2s ease;
        }

        .product-card:active {
            border-color: #0088cc;
        }

        .img-container {
            width: 100%;
            height: 130px;
            background: #ffffff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            padding: 8px;
        }

        .product-card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .product-card h3 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
            line-height: 1.2;
        }

        .product-card .desc {
            font-size: 11px;
            color: #888899;
            line-height: 1.4;
            margin-bottom: 12px;
            flex-grow: 1;
        }

        .product-card .price {
            font-weight: 800;
            color: #00ff88;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .btn-add {
            width: 100%;
            background: #0088cc;
            color: #ffffff;
            border: none;
            padding: 10px 0;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn-add:active {
            background: #00aaff;
            transform: scale(0.96);
        }

        .cart-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 400px;
            background: #0088cc;
            color: #ffffff;
            padding: 14px 20px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 15px;
            display: none;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 136, 204, 0.4);
            cursor: pointer;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <h1>Каталог Chaser</h1>

    <div id="products-container" class="products-grid"></div>

    <div id="cart-bar" class="cart-bar" onclick="sendOrder()">
        <span>Оформить заказ (<span id="cart-count">0</span>)</span>
        <span id="cart-total">0 PLN</span>
    </div>

    <script>
        const tg = window.Telegram?.WebApp || null;

        const products = [
            {
                id: 1,
                name: "Chaser Mint",
                price: 60,
                volume: "30ml",
                img: "mint.jpg",
                description: "Освежающий, чистый и бодрящий вкус перечной мяты. Идеальная прохлада для ежедневного парения."
            },
            {
                id: 2,
                name: "Chaser Grape Plus",
                price: 60,
                volume: "30ml",
                img: "grape_plus.jpg?v=3",
                description: "Насыщенный вкус сочного тёмного винограда с усиленной ароматикой. Настоящая ягодная феерия."
            },
            {
                id: 3,
                name: "Chaser Pineapple",
                price: 60,
                volume: "30ml",
                img: "pineapple.jpg",
                description: "Яркий и сладкий тропический ананас с лёгкой приятной кислинкой сочной мякоти."
            },
            {
                id: 4,
                name: "Chaser Energy Cherry",
                price: 60,
                volume: "30ml",
                img: "energy_cherry.jpg",
                description: "Мощный тонизирующий микс бодрящего энергетика и спелой вишни."
            },
            {
                id: 5,
                name: "Chaser Lux Tropic Punch",
                price: 60,
                volume: "30ml",
                img: "tropic_punch.jpg",
                description: "Экзотический тропический пунш из линейки Lux Balance — гармоничное сочетание сочного манго и спелых цитрусов."
            },
            {
                id: 6,
                name: "Chaser Lux Blueberry Mint",
                price: 60,
                volume: "30ml",
                img: "blueberry_mint.jpg",
                description: "Премиальный микс спелой лесной черники и прохладных листочков свежей мяты."
            },
            {
                id: 7,
                name: "Chaser Triple Raspberry",
                price: 60,
                volume: "30ml",
                img: "triple_raspberry.jpg",
                description: "Уникальное сочетание трёх сортов малины: красной, жёлтой и синей."
            },
            {
                id: 8,
                name: "Chaser Pink Lemonade",
                price: 60,
                volume: "30ml",
                img: "pink_lemonade.jpg",
                description: "Классический розовый лимонад из сладкой малины и освежающего лимона со льдом."
            }
        ];

        let cart = [];

        function renderProducts() {
            const container = document.getElementById('products-container');
            if (!container) return;

            container.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="img-container">
                        <img src="${product.img}" alt="${product.name}" onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/kisaki2007/chaser-shop/main/watermelon.jpg';">
                    </div>
                    <h3>${product.name}</h3>
                    <p class="desc">${product.description}</p>
                    <p class="price">${product.price} PLN</p>
                    <button onclick="addToCart(${product.id})" class="btn-add">Добавить в корзину</button>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const item = products.find(p => p.id === productId);
            if (item) {
                cart.push(item);
                updateCartUI();
            }
        }

        function updateCartUI() {
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            const count = cart.length;

            if (tg && tg.MainButton) {
                if (count > 0) {
                    tg.MainButton.setText(`Оформить заказ (${count}) • ${total} PLN`);
                    tg.MainButton.setParams({
                        color: '#0088cc',
                        text_color: '#ffffff'
                    });
                    tg.MainButton.show();
                } else {
                    tg.MainButton.hide();
                }
            } else {
                const cartBar = document.getElementById('cart-bar');
                if (count > 0) {
                    document.getElementById('cart-count').innerText = count;
                    document.getElementById('cart-total').innerText = `${total} PLN`;
                    cartBar.style.display = 'flex';
                } else {
                    cartBar.style.display = 'none';
                }
            }
        }

        function sendOrder() {
            if (cart.length === 0) return;
            if (tg) {
                tg.sendData(JSON.stringify(cart));
            } else {
                alert(`Заказ сформирован! Товаров: ${cart.length}, Сумма: ${cart.reduce((s, i) => s + i.price, 0)} PLN`);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderProducts();

            if (tg) {
                try {
                    tg.ready();
                    tg.expand();
                    tg.onEvent('mainButtonClicked', sendOrder);
                } catch (e) {
                    console.log("Запущено вне Telegram", e);
                }
            }
        });
    </script>
</body>
</html>
</html>
