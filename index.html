<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CHAOS SHOP</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap');

    :root {
      --bg-color: #0b0b0d;
      --card-bg: #131316;
      --border-color: #232328;
      --accent-yellow: #f2c94c;
      --accent-yellow-glow: rgba(242, 201, 76, 0.35);
      --text-white: #ffffff;
      --text-gray: #8d8d95;
      --green-stock: #1b382b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text-white);
      padding: 16px;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* УВЕДОМЛЕНИЕ */
    #toast-notification {
      position: fixed;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent-yellow);
      color: #000;
      font-weight: 800;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 30px;
      box-shadow: 0 4px 20px var(--accent-yellow-glow);
      z-index: 20000;
      transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    #toast-notification.show {
      top: 20px;
    }

    /* МОДАЛКА D&N */
    #welcome-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(11, 11, 13, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    .welcome-box {
      background: #151518;
      border: 1px solid var(--accent-yellow);
      box-shadow: 0 0 25px var(--accent-yellow-glow);
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      max-width: 320px;
      width: 90%;
    }

    .welcome-initials {
      font-family: 'Georgia', serif;
      font-size: 56px;
      font-weight: 700;
      color: var(--accent-yellow);
      text-shadow: 0 0 12px var(--accent-yellow-glow);
      margin-bottom: 5px;
    }

    .welcome-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--text-white);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .welcome-desc {
      font-size: 13px;
      color: var(--text-gray);
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .btn-welcome {
      width: 100%;
      background: var(--accent-yellow);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 4px 15px var(--accent-yellow-glow);
    }

    /* ШАПКА */
    header {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    .shop-title {
      font-size: 32px;
      font-weight: 900;
      color: var(--accent-yellow);
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 15px var(--accent-yellow-glow);
    }

    /* ТАБЫ */
    .tabs-container {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-gray);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent-yellow);
      color: #000000;
      border-color: var(--accent-yellow);
      box-shadow: 0 0 15px var(--accent-yellow-glow);
    }

    /* КАТАЛОГ */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
    }

    .img-box {
      width: 100%;
      height: 125px;
      border-radius: 14px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 10px;
      padding: 6px;
    }

    .img-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .stock-tag {
      background: var(--green-stock);
      color: #2ecc71;
      border: 1px solid rgba(46, 204, 113, 0.3);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    .product-name {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 4px;
      color: var(--text-white);
      line-height: 1.2;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-price {
      font-size: 16px;
      font-weight: 900;
      color: var(--accent-yellow);
      margin-bottom: 10px;
    }

    .btn-buy {
      width: 100%;
      background: var(--accent-yellow);
      color: #000000;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
    }

    /* КОРЗИНА И ФОРМА */
    #cart-screen {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 20px;
    }

    .cart-title {
      text-align: center;
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 20px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .cart-item-info .name {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .cart-item-info .price {
      font-size: 14px;
      font-weight: 800;
      color: var(--accent-yellow);
    }

    .qty-picker {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-qty {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--accent-yellow);
      background: transparent;
      color: var(--accent-yellow);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .qty-num {
      font-size: 15px;
      font-weight: 800;
    }

    .cart-divider {
      border-top: 1px dashed var(--border-color);
      margin: 20px 0;
    }

    /* ПОЛЯ ДЛЯ ДОСТАВКИ */
    .delivery-section {
      margin-top: 20px;
      margin-bottom: 20px;
    }

    .delivery-section-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 12px;
      color: var(--accent-yellow);
      text-transform: uppercase;
    }

    .input-group {
      margin-bottom: 12px;
      text-align: left;
    }

    .input-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-gray);
      margin-bottom: 6px;
      display: block;
    }

    .form-input {
      width: 100%;
      background: #1a1a1f;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      color: var(--text-white);
      font-size: 14px;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--accent-yellow);
    }

    .cart-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 20px;
    }

    .cart-total-row .val {
      color: var(--accent-yellow);
    }

    .btn-checkout {
      width: 100%;
      background: var(--accent-yellow);
      color: #000000;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 15px var(--accent-yellow-glow);
    }

    .empty-msg {
      text-align: center;
      color: var(--text-gray);
      padding: 30px 0;
      font-size: 14px;
    }

    /* МОДАЛКА ТОВАРА */
    #product-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(11, 11, 13, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 20px;
    }

    .modal-card {
      background: #16161a;
      border: 1px solid var(--accent-yellow);
      box-shadow: 0 0 30px var(--accent-yellow-glow);
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      padding: 20px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .close-modal-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--text-white);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .modal-img-box {
      width: 100%;
      height: 180px;
      background: #ffffff;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      padding: 10px;
    }

    .modal-img-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 900;
      color: var(--text-white);
      margin-bottom: 6px;
    }

    .modal-desc {
      font-size: 13px;
      color: var(--text-gray);
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .modal-price {
      font-size: 22px;
      font-weight: 900;
      color: var(--accent-yellow);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <!-- УВЕДОМЛЕНИЕ -->
  <div id="toast-notification">Добавлено 🛒</div>

  <!-- МОДАЛКА D&N -->
  <div id="welcome-modal">
    <div class="welcome-box">
      <div class="welcome-initials">D&N</div>
      <div class="welcome-title">CHAOS SHOP</div>
      <div class="welcome-desc">Добро пожаловать в официальный каталог.</div>
      <button class="btn-welcome" onclick="closeWelcome()">ВОЙТИ В МАГАЗИН</button>
    </div>
  </div>

  <!-- ШАПКА -->
  <header>
    <h1 class="shop-title">CHAOS SHOP</h1>
  </header>

  <!-- ВКЛАДКИ -->
  <div class="tabs-container">
    <button class="tab-btn active" id="btn-tab-catalog" onclick="switchTab('catalog')">Каталог</button>
    <button class="tab-btn" id="btn-tab-cart" onclick="switchTab('cart')">Корзина (0)</button>
  </div>

  <!-- КАТАЛОГ -->
  <div id="catalog-screen">
    <div class="catalog-grid" id="catalog-grid"></div>
  </div>

  <!-- КОРЗИНА -->
  <div id="cart-screen">
    <div class="cart-title">Ваша корзина</div>
    <div id="cart-list"></div>

    <div id="delivery-form-container" style="display: none;">
      <div class="cart-divider"></div>
      
      <div class="delivery-section">
        <div class="delivery-section-title">Данные для доставки</div>
        
        <div class="input-group">
          <label class="input-label" for="cust-name">Имя и Фамилия (латиница):</label>
          <input type="text" id="cust-name" class="form-input" placeholder="например, Jan Kowalski">
        </div>

        <div class="input-group">
          <label class="input-label" for="cust-address">Адрес доставки / Paczkomat:</label>
          <input type="text" id="cust-address" class="form-input" placeholder="Город, номер Paczkomat или адрес">
        </div>

        <div class="input-group">
          <label class="input-label" for="cust-phone">Номер телефона:</label>
          <input type="tel" id="cust-phone" class="form-input" placeholder="+48 123 456 789">
        </div>
      </div>

      <div class="cart-divider"></div>
      <div class="cart-total-row">
        <span>Итого:</span>
        <span class="val" id="total-val">0 PLN</span>
      </div>
      <button class="btn-checkout" id="submit-btn" onclick="checkout()">ОФОРМИТЬ ЗАКАЗ 🚀</button>
    </div>
  </div>

  <!-- МОДАЛКА ТОВАРА -->
  <div id="product-modal">
    <div class="modal-card">
      <button class="close-modal-btn" onclick="closeProductModal()">✕</button>
      <div class="modal-img-box">
        <img id="modal-img" src="" alt="Товар">
      </div>
      <div class="stock-tag" id="modal-stock"></div>
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-desc" id="modal-desc"></div>
      <div class="modal-price" id="modal-price"></div>
      <button class="btn-buy" id="modal-buy-btn">В КОРЗИНУ</button>
    </div>
  </div>

  <script>
    const BOT_TOKEN = "8748194051:AAFwx3gA-r1-E7RI0daLUluvyQhCcrI3vQk";
    const ADMIN_ID = 1042492622;
    const ADMIN_USERNAME = "Macwinn";

    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    function closeWelcome() {
      const modal = document.getElementById('welcome-modal');
      modal.style.opacity = '0';
      setTimeout(() => { modal.style.display = 'none'; }, 400);
    }

    let toastTimer;
    function showToast() {
      const toast = document.getElementById('toast-notification');
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    const products = [
      { id: 1, name: "Chaser Mint", price: 60, stock: 4, img: "./mint.jpg", desc: "Освежающий, чистый и морозный вкус классической перечной мяты." },
      { id: 2, name: "Chaser Grape Plus", price: 60, stock: 3, img: "./grape_plus.jpg", desc: "Насыщенный и сочный вкус спелого тёмного винограда с легкой кислинкой." },
      { id: 3, name: "Chaser Watermelon", price: 60, stock: 3, img: "./watermelon.jpg", desc: "Сочный летний арбуз! Нежная мякоть спелого арбуза с легким освежающим оттенком." },
      { id: 4, name: "Chaser Blueberry Mint", price: 60, stock: 3, img: "./blueberry_mint.jpg", desc: "Идеальное сочетание спелой лесной черники и прохладной мяты." },
      { id: 5, name: "Chaser Energy Cherry", price: 60, stock: 4, img: "./energy_cherry.jpg", desc: "Яркий вкус бодрящего энергетического напитка с сочной спелой вишней." },
      { id: 6, name: "Chaser Energy Raspberry", price: 60, stock: 3, img: "./energy_raspberry.jpg", desc: "Взрывной микс энергетика и душистой малины." },
      { id: 7, name: "Chaser Pineapple", price: 60, stock: 4, img: "./pineapple.jpg", desc: "Яркий, тропический и сладкий ананас с легкой кислинкой." },
      { id: 8, name: "Chaser Pink Lemonade", price: 60, stock: 2, img: "./pink_lemonade.jpg", desc: "Классический розовый лимонад: цитрусовый лимонад и сладкие ягоды." },
      { id: 9, name: "Chaser Triple Raspberry", price: 60, stock: 4, img: "./triple_raspberry.jpg", desc: "Тройной малиновый удар из красной, чёрной и синей малины." },
      { id: 10, name: "Chaser Tropic Punch", price: 60, stock: 4, img: "./tropic_punch.jpg", desc: "Экзотический тропический пунш из манго, маракуйи и гуавы." }
    ];

    let cart = {};

    function renderCatalog() {
      const grid = document.getElementById('catalog-grid');
      grid.innerHTML = '';
      products.forEach(p => {
        grid.innerHTML += `
          <div class="product-card" onclick="openProductModal(${p.id})">
            <div class="img-box">
              <img src="${p.img}" alt="${p.name}">
            </div>
            <div class="stock-tag">${p.stock} шт в наличии ✅</div>
            <div class="product-name">${p.name}</div>
            <div class="product-price">${p.price} PLN</div>
            <button class="btn-buy" onclick="event.stopPropagation(); addToCart(${p.id})">В КОРЗИНУ</button>
          </div>
        `;
      });
    }

    function openProductModal(id) {
      const p = products.find(item => item.id === id);
      if (!p) return;

      document.getElementById('modal-img').src = p.img;
      document.getElementById('modal-stock').innerText = `${p.stock} шт в наличии ✅`;
      document.getElementById('modal-title').innerText = p.name;
      document.getElementById('modal-desc').innerText = p.desc;
      document.getElementById('modal-price').innerText = `${p.price} PLN`;
      
      const buyBtn = document.getElementById('modal-buy-btn');
      buyBtn.onclick = function() {
        addToCart(p.id);
        closeProductModal();
      };

      document.getElementById('product-modal').style.display = 'flex';
    }

    function closeProductModal() {
      document.getElementById('product-modal').style.display = 'none';
    }

    function switchTab(tab) {
      const catBtn = document.getElementById('btn-tab-catalog');
      const cartBtn = document.getElementById('btn-tab-cart');
      const catScreen = document.getElementById('catalog-screen');
      const cartScreen = document.getElementById('cart-screen');

      if (tab === 'catalog') {
        catBtn.classList.add('active');
        cartBtn.classList.remove('active');
        catScreen.style.display = 'block';
        cartScreen.style.display = 'none';
      } else {
        cartBtn.classList.add('active');
        catBtn.classList.remove('active');
        catScreen.style.display = 'none';
        cartScreen.style.display = 'block';
        renderCart();
      }
    }

    function addToCart(id) {
      if (cart[id]) {
        cart[id].qty += 1;
      } else {
        const item = products.find(p => p.id === id);
        cart[id] = { ...item, qty: 1 };
      }
      updateCartCount();
      showToast();
    }

    function changeQty(id, delta) {
      if (cart[id]) {
        cart[id].qty += delta;
        if (cart[id].qty <= 0) delete cart[id];
      }
      updateCartCount();
      renderCart();
    }

    function updateCartCount() {
      const totalQty = Object.values(cart).reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('btn-tab-cart').innerText = `Корзина (${totalQty})`;
    }

    function renderCart() {
      const list = document.getElementById('cart-list');
      const totalVal = document.getElementById('total-val');
      const formContainer = document.getElementById('delivery-form-container');
      const keys = Object.keys(cart);

      if (keys.length === 0) {
        list.innerHTML = '<div class="empty-msg">Ваша корзина пуста</div>';
        totalVal.innerText = '0 PLN';
        formContainer.style.display = 'none';
        return;
      }

      formContainer.style.display = 'block';
      list.innerHTML = '';
      let total = 0;

      keys.forEach(id => {
        const item = cart[id];
        const itemTotal = item.price * item.qty;
        total += itemTotal;

        list.innerHTML += `
          <div class="cart-item">
            <div class="cart-item-info">
              <div class="name">${item.name}</div>
              <div class="price">${item.price} PLN</div>
            </div>
            <div class="qty-picker">
              <button class="btn-qty" onclick="changeQty(${id}, -1)">-</button>
              <span class="qty-num">${item.qty}</span>
              <button class="btn-qty" onclick="changeQty(${id}, 1)">+</button>
            </div>
          </div>
        `;
      });

      totalVal.innerText = `${total} PLN`;
    }

    async function checkout() {
      const itemsArray = Object.values(cart);
      if (itemsArray.length === 0) {
        alert("Добавьте хотя бы один товар!");
        return;
      }

      const name = document.getElementById('cust-name').value.trim();
      const address = document.getElementById('cust-address').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();

      if (!name || !address || !phone) {
        alert("Пожалуйста, заполните все поля для доставки!");
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.innerText = "ОТПРАВКА...";
      btn.disabled = true;

      const user = tg?.initDataUnsafe?.user || {};
      const usernameStr = user.username ? `@${user.username}` : "не указан";
      const firstName = user.first_name || "Покупатель";

      const totalSum = itemsArray.reduce((sum, i) => sum + i.price * i.qty, 0);
      const itemsText = itemsArray.map(i => `• **${i.name}** х ${i.qty} шт. — \`${i.price * i.qty} PLN\``).join('\n');

      const adminMessage = `🚀 **НОВЫЙ ЗАКАЗ В CHAOS SHOP!**\n\n` +
        `👤 **Покупатель:** ${firstName} (${usernameStr})\n` +
        `🆔 **ID:** \`${user.id || 'неизвестно'}\`\n\n` +
        `📦 **Состав заказа:**\n${itemsText}\n\n` +
        `💰 **Итого к оплате:** \`${totalSum} PLN\`\n\n` +
        `🚚 **ДАННЫЕ ДОСТАВКИ:**\n` +
        `▫️ **Имя/Фамилия:** \`${name}\`\n` +
        `▫️ **Адрес/Paczkomat:** \`${address}\`\n` +
        `▫️ **Телефон:** \`${phone}\``;

      const userMessage = `✅ **Ваш заказ оформлен!**\n\n` +
        `📦 **Ваш выбор:**\n${itemsText}\n\n` +
        `💰 **Сумма:** \`${totalSum} PLN\`\n\n` +
        `🚚 **Доставка:** ${address} (${name})\n\n` +
        `Для подтверждения и оплаты напишите менеджеру: @${ADMIN_USERNAME}`;

      try {
        // 1. Отправляем сообщение администратору
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: ADMIN_ID,
            text: adminMessage,
            parse_mode: 'Markdown'
          })
        });

        // 2. Отправляем сообщение покупателю (если известный chat_id)
        if (user.id) {
          await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: user.id,
              text: userMessage,
              parse_mode: 'Markdown'
            })
          });
        }

        alert("✅ Заказ оформлен! Данные отправлены менеджеру.");
        if (tg) tg.close();
      } catch (err) {
        alert("Ошибка сети при отправке заказа: " + err.message);
        btn.innerText = "ОФОРМИТЬ ЗАКАЗ 🚀";
        btn.disabled = false;
      }
    }

    renderCatalog();
  </script>
</body>
</html>
