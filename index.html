<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaser Vape Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #121212;
            --gold-border: #d4af37;
            --gold-gradient: linear-gradient(135deg, #f39c12, #d4af37, #f1c40f);
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            padding-bottom: 110px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 22px;
            color: var(--gold-border);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }

        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--gold-border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
            text-align: center;
        }

        .card-img-wrapper {
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .card-img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.7));
        }

        .card-title {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 6px;
            color: #fff;
        }

        .card-price {
            color: var(--gold-border);
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 12px;
        }

        .btn-add {
            background: transparent;
            color: var(--gold-border);
            border: 1px solid var(--gold-border);
            padding: 9px 0;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }

        .btn-add:active {
            background: var(--gold-gradient);
            color: #000;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a1a1a;
            border: 1px solid var(--gold-border);
            border-radius: 6px;
        }

        .btn-small {
            background: transparent;
            color: var(--gold-border);
            border: none;
            width: 32px;
            height: 32px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .count {
            font-weight: bold;
            font-size: 14px;
        }

        /* Панель корзины */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #111;
            border-top: 1px solid var(--gold-border);
            padding: 14px 20px;
            display: none;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        .cart-total {
            font-size: 18px;
            font-weight: bold;
            color: var(--gold-border);
        }

        .btn-checkout {
            background: var(--gold-gradient);
            color: #000;
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
        }

        /* Модалка оформления */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background: #141414;
            border: 1px solid var(--gold-border);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 340px;
        }

        .modal-title {
            color: var(--gold-border);
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 14px;
            text-align: center;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 10px;
            background: #080808;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-family: inherit;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-cancel {
            background: #222;
            color: #ccc;
            border: none;
            padding: 10px;
            border-radius: 6px;
            flex: 1;
            cursor: pointer;
        }

        .btn-submit {
            background: var(--gold-gradient);
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            flex: 1;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>CHASER STORE</h1>
    </div>

    <div class="products-grid" id="products"></div>

    <div class="cart-bar" id="cartBar">
        <div>
            <div style="font-size: 10px; color: var(--text-muted);">ИТОГО:</div>
            <div class="cart-total" id="totalPrice">0 zł</div>
        </div>
        <button class="btn-checkout" onclick="openModal()">Оформить</button>
    </div>

    <div class="modal" id="orderModal">
        <div class="modal-content">
            <div class="modal-title">Данные для доставки</div>
            <div class="input-group">
                <label>Имя и Фамилия</label>
                <input type="text" id="custName" placeholder="Александр">
            </div>
            <div class="input-group">
                <label>Номер телефона</label>
                <input type="tel" id="custPhone" placeholder="+48 123 456 789">
            </div>
            <div class="input-group">
                <label>Адрес / Paczkomat</label>
                <textarea id="custAddress" rows="2" placeholder="г. Варшава, Paczkomat WAW01M"></textarea>
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">Назад</button>
                <button class="btn-submit" onclick="sendOrder()">Заказать</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Список товаров без скидок
        const productsData = [
            { 
                id: 1, 
                name: 'Chaser Energy Raspberry (30ml)', 
                price: 60, 
                img: 'chaser_raspberry.jpg'
            },
            { 
                id: 2, 
                name: 'Chaser Watermelon (30ml)', 
                price: 60, 
                img: 'watermarked_img_13438544672643606026.jpg'
            }
        ];

        const cart = {};

        function renderProducts() {
            const container = document.getElementById('products');
            container.innerHTML = '';

            productsData.forEach(p => {
                const count = cart[p.id] || 0;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${p.img}" class="card-img" alt="${p.name}">
                    </div>
                    <div>
                        <div class="card-title">${p.name}</div>
                        <div class="card-price">${p.price} zł</div>
                    </div>
                    <div>
                        ${count === 0 ? 
                            `<button class="btn-add" onclick="updateCount(${p.id}, 1)">ADD TO CART</button>` :
                            `<div class="controls">
                                <button class="btn-small" onclick="updateCount(${p.id}, -1)">-</button>
                                <span class="count">${count}</span>
                                <button class="btn-small" onclick="updateCount(${p.id}, 1)">+</button>
                            </div>`
                        }
                    </div>
                `;
                container.appendChild(card);
            });

            updateCartBar();
        }

        function updateCount(id, delta) {
            const current = cart[id] || 0;
            const next = current + delta;
            if (next <= 0) {
                delete cart[id];
            } else {
                cart[id] = next;
            }
            renderProducts();
        }

        function calculateTotal() {
            let totalItems = 0;
            let totalPrice = 0;

            for (const [id, qty] of Object.entries(cart)) {
                const product = productsData.find(p => p.id == id);
                if (product) {
                    totalItems += qty;
                    totalPrice += qty * product.price;
                }
            }
            return { totalItems, totalPrice };
        }

        function updateCartBar() {
            const { totalItems, totalPrice } = calculateTotal();
            const cartBar = document.getElementById('cartBar');
            
            if (totalItems > 0) {
                cartBar.style.display = 'flex';
                document.getElementById('totalPrice').innerText = `${totalPrice} zł`;
            } else {
                cartBar.style.display = 'none';
            }
        }

        function openModal() {
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('orderModal').style.display = 'none';
        }

        function sendOrder() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const address = document.getElementById('custAddress').value.trim();

            if (!name || !phone) {
                alert('Укажите имя и телефон!');
                return;
            }

            const items = [];
            for (const [id, qty] of Object.entries(cart)) {
                const product = productsData.find(p => p.id == id);
                if (product) {
                    items.push({
                        name: product.name,
                        quantity: qty,
                        price: product.price,
                        sum: qty * product.price
                    });
                }
            }

            const { totalPrice } = calculateTotal();

            tg.sendData(JSON.stringify({
                items: items,
                totalPrice: totalPrice,
                customer: { name, phone, address }
            }));
        }

        renderProducts();
    </script>
</body>
</html>
