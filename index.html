<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaser Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121216;
            color: #ffffff;
            padding: 20px 16px;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .product-card {
            background: #1c1c24;
            border-radius: 16px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s ease;
        }

        .img-container {
            width: 100%;
            height: 140px;
            background: #ffffff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            padding: 8px;
            overflow: hidden;
        }

        .product-card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .product-card h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .product-card .desc {
            font-size: 11px;
            color: #9a9aab;
            line-height: 1.3;
            margin-bottom: 12px;
            flex-grow: 1;
        }

        .product-card .price {
            font-weight: 700;
            color: #00e676;
            font-size: 15px;
            margin-bottom: 12px;
        }

        .btn-add {
            width: 100%;
            background-color: #0088cc;
            color: #ffffff;
            border: none;
            padding: 10px 0;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-add:active {
            background-color: #006699;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <h1>Каталог Chaser</h1>

    <div id="products-container" class="products-grid"></div>

    <script>
        const tg = window.Telegram?.WebApp || null;

        const products = [
            {
                id: 1,
                name: "Chaser Mint",
                price: 60,
                volume: "30ml",
                img: "mint.jpg",
                description: "Освежающий, чистый и бодрящий вкус перечной мяты."
            },
            {
                id: 2,
                name: "Chaser Grape Plus",
                price: 60,
                volume: "30ml",
                img: "grape_plus.jpg", // Если в папке файл называется grape.jpg — переименуй тут или на GitHub
                description: "Насыщенный вкус сочного тёмного винограда."
            },
            {
                id: 3,
                name: "Chaser Pineapple",
                price: 60,
                volume: "30ml",
                img: "pineapple.jpg",
                description: "Яркий и сладкий тропический ананас."
            },
            {
                id: 4,
                name: "Chaser Energy Cherry",
                price: 60,
                volume: "30ml",
                img: "energy_cherry.jpg",
                description: "Микс бодрящего энергетика и спелой вишни."
            },
            {
                id: 5,
                name: "Chaser Lux Tropic Punch",
                price: 60,
                volume: "30ml",
                img: "tropic_punch.jpg",
                description: "Тропический пунш: манго и цитрусы."
            },
            {
                id: 6,
                name: "Chaser Lux Blueberry Mint",
                price: 60,
                volume: "30ml",
                img: "blueberry_mint.jpg",
                description: "Премиальный микс черники и свежей мяты."
            },
            {
                id: 7,
                name: "Chaser Triple Raspberry",
                price: 60,
                volume: "30ml",
                img: "triple_raspberry.jpg",
                description: "Сочетание трех сортов малины."
            },
            {
                id: 8,
                name: "Chaser Pink Lemonade",
                price: 60,
                volume: "30ml",
                img: "pink_lemonade.jpg",
                description: "Розовый лимонад: малина и лимон со льдом."
            }
        ];

        let cart = [];

        function renderProducts() {
            const container = document.getElementById('products-container');
            if (!container) return;

            container.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="img-container">
                        <img src="${product.img}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                    </div>
                    <h3>${product.name}</h3>
                    <p class="desc">${product.description}</p>
                    <p class="price">${product.price} PLN</p>
                    <button onclick="addToCart(${product.id})" class="btn-add">Добавить</button>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const item = products.find(p => p.id === productId);
            if (item) {
                cart.push(item);
                updateTelegramMainButton();
            }
        }

        function updateTelegramMainButton() {
            if (!tg || !tg.MainButton) return;
            
            if (cart.length > 0) {
                const total = cart.reduce((sum, item) => sum + item.price, 0);
                tg.MainButton.setText(`Оформить заказ (${total} PLN)`);
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderProducts();

            if (tg) {
                try {
                    tg.ready();
                    tg.expand();
                    tg.onEvent('mainButtonClicked', () => {
                        tg.sendData(JSON.stringify(cart));
                    });
                } catch (e) {
                    console.log("Запущено вне Telegram", e);
                }
            }
        });
    </script>
</body>
</html>
