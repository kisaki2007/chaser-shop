<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Vape Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --gold-primary: #d4af37;
            --gold-gradient: linear-gradient(135deg, #f39c12, #d4af37, #f1c40f);
            --text-color: #f5f5f5;
            --text-muted: #a0a0a0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            padding-bottom: 90px; /* Отступ под зафиксированную корзину */
        }

        h1 {
            text-align: center;
            font-size: 20px;
            color: var(--gold-primary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .card-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .card-desc {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .card-price {
            font-size: 15px;
            color: var(--gold-primary);
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* Кнопки управления количеством */
        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 2px;
        }

        .btn-small {
            background: var(--gold-gradient);
            color: #000;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .count {
            font-weight: bold;
            font-size: 14px;
        }

        .btn-add {
            background: var(--gold-gradient);
            color: #000;
            border: none;
            padding: 8px 0;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        /* Панель корзины снизу */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #141414;
            border-top: 1px solid var(--gold-primary);
            padding: 12px 16px;
            display: none;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 -5px 20px rgba(212, 175, 55, 0.15);
        }

        .cart-info {
            display: flex;
            flex-direction: column;
        }

        .cart-total {
            font-size: 16px;
            font-weight: bold;
            color: var(--gold-primary);
        }

        .cart-count {
            font-size: 12px;
            color: var(--text-muted);
        }

        .btn-checkout {
            background: var(--gold-gradient);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>GOLD VAPE STORE</h1>

    <div class="products-grid" id="products"></div>

    <!-- Фиксированная панель корзины -->
    <div class="cart-bar" id="cartBar">
        <div class="cart-info">
            <span class="cart-total" id="totalPrice">0 ₽</span>
            <span class="cart-count" id="totalCount">0 товаров</span>
        </div>
        <button class="btn-checkout" onclick="checkout()">Оформить заказ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Список товаров
        const productsData = [
            { id: 1, name: 'Mango Ice 30ml', price: 850, desc: 'Сочный манго с кулером' },
            { id: 2, name: 'Berry Mix 30ml', price: 850, desc: 'Лесные ягоды' },
            { id: 3, name: 'Tobacco Gold 30ml', price: 900, desc: 'Классический табак' },
            { id: 4, name: 'Melon Mint 30ml', price: 850, desc: 'Дыня с мятой' }
        ];

        // Состояние корзины: { productId: quantity }
        const cart = {};

        function renderProducts() {
            const container = document.getElementById('products');
            container.innerHTML = '';

            productsData.forEach(p => {
                const count = cart[p.id] || 0;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="card-title">${p.name}</div>
                        <div class="card-desc">${p.desc}</div>
                    </div>
                    <div>
                        <div class="card-price">${p.price} ₽</div>
                        ${count === 0 ? 
                            `<button class="btn-add" onclick="updateCount(${p.id}, 1)">В корзину</button>` :
                            `<div class="controls">
                                <button class="btn-small" onclick="updateCount(${p.id}, -1)">-</button>
                                <span class="count">${count}</span>
                                <button class="btn-small" onclick="updateCount(${p.id}, 1)">+</button>
                            </div>`
                        }
                    </div>
                `;
                container.appendChild(card);
            });

            updateCartBar();
        }

        function updateCount(id, delta) {
            const current = cart[id] || 0;
            const next = current + delta;
            if (next <= 0) {
                delete cart[id];
            } else {
                cart[id] = next;
            }
            renderProducts();
        }

        function updateCartBar() {
            let totalItems = 0;
            let totalPrice = 0;

            for (const [id, qty] of Object.entries(cart)) {
                const product = productsData.find(p => p.id == id);
                if (product) {
                    totalItems += qty;
                    totalPrice += product.price * qty;
                }
            }

            const cartBar = document.getElementById('cartBar');
            if (totalItems > 0) {
                cartBar.style.display = 'flex';
                document.getElementById('totalPrice').innerText = `${totalPrice} ₽`;
                document.getElementById('totalCount').innerText = `${totalItems} шт.`;
            } else {
                cartBar.style.display = 'none';
            }
        }

        function checkout() {
            const items = [];
            let totalPrice = 0;

            for (const [id, qty] of Object.entries(cart)) {
                const product = productsData.find(p => p.id == id);
                if (product) {
                    items.push({
                        name: product.name,
                        price: product.price,
                        quantity: qty,
                        sum: product.price * qty
                    });
                    totalPrice += product.price * qty;
                }
            }

            // Отправляем структурированный массив заказа в Telegram
            tg.sendData(JSON.stringify({
                items: items,
                totalPrice: totalPrice
            }));
        }

        // Первичная отрисовка
        renderProducts();
    </script>
</body>
</html>
