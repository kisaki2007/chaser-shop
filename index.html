<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chaser Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #161616;
            --accent-gold: #d4af37;
            --accent-gold-hover: #b5932a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border-color: #222222;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 16px 100px 16px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 20px;
            letter-spacing: 3px;
            font-weight: 700;
            color: var(--accent-gold);
            text-transform: uppercase;
        }

        .products-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .product-card img {
            width: 100%;
            max-height: 220px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 14px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 14px;
        }

        .btn-add {
            background: linear-gradient(135deg, var(--accent-gold), #997b1e);
            color: #000000;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-add:active {
            opacity: 0.8;
        }

        /* Minimalist Cart & Form */
        .section-title {
            font-size: 14px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 30px 0 12px 4px;
        }

        .card-block {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #222;
            font-size: 14px;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-qty {
            background: #252525;
            color: #fff;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group:last-child {
            margin-bottom: 0;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #2a2a2a;
            background: #090909;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent-gold);
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            font-size: 16px;
            font-weight: 700;
        }

        .total-price {
            color: var(--accent-gold);
            font-size: 18px;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--accent-gold), #997b1e);
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            margin-top: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>CHASER STORE</h1>
    </header>

    <div class="products-grid" id="products"></div>

    <div class="section-title">Корзина</div>
    <div class="card-block">
        <div id="cart-items">
            <p style="text-align: center; color: var(--text-muted); font-size: 14px;">Корзина пуста</p>
        </div>
        <div class="total-row">
            <span>Итого:</span>
            <span class="total-price" id="total-price">0 PLN</span>
        </div>
    </div>

    <div class="section-title">Данные для доставки</div>
    <div class="card-block">
        <div class="input-group">
            <input type="text" id="name" placeholder="Имя и Фамилия">
        </div>
        <div class="input-group">
            <input type="tel" id="phone" placeholder="Номер телефона">
        </div>
        <div class="input-group">
            <input type="text" id="address" placeholder="Город и № отделения / Адрес">
        </div>
        <button class="btn-submit" id="checkout-btn">Оформить заказ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ⚠️ ЗАМЕНИТЕ ссылку на изображение из вашего репозитория или хостинга
        const products = [
            {
                id: 1,
                name: "Chaser Balance - Energy Raspberry (30ml)",
                price: 60,
                img: "img/energy_raspberry.jpg" // Укажите путь к сохраненной картинке без банки слева
            }
        ];

        let cart = {};

        function renderProducts() {
            const container = document.getElementById('products');
            container.innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.img}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/300/161616/d4af37?text=Chaser+Raspberry'">
                    <div class="product-title">${p.name}</div>
                    <div class="product-price">${p.price} PLN</div>
                    <button class="btn-add" onclick="addToCart(${p.id})">Добавить в корзину</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            cart[id] = (cart[id] || 0) + 1;
            updateCartUI();
        }

        function changeQty(id, delta) {
            if (cart[id]) {
                cart[id] += delta;
                if (cart[id] <= 0) delete cart[id];
            }
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('total-price');
            const keys = Object.keys(cart);

            if (keys.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-size: 14px;">Корзина пуста</p>';
                totalEl.innerText = '0 PLN';
                return;
            }

            let total = 0;
            container.innerHTML = keys.map(id => {
                const product = products.find(p => p.id == id);
                const count = cart[id];
                const sum = product.price * count;
                total += sum;
                return `
                    <div class="cart-item">
                        <div>
                            <div>${product.name}</div>
                            <div style="color: var(--text-muted); font-size: 12px;">${product.price} PLN × ${count}</div>
                        </div>
                        <div class="cart-controls">
                            <button class="btn-qty" onclick="changeQty(${id}, -1)">-</button>
                            <span>${count}</span>
                            <button class="btn-qty" onclick="changeQty(${id}, 1)">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            totalEl.innerText = `${total} PLN`;
        }

        document.getElementById('checkout-btn').addEventListener('click', () => {
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();

            if (Object.keys(cart).length === 0) {
                alert("Ваша корзина пуста!");
                return;
            }
            if (!name || !phone || !address) {
                alert("Пожалуйста, заполните все поля доставки.");
                return;
            }

            const items = Object.keys(cart).map(id => {
                const p = products.find(prod => prod.id == id);
                return { name: p.name, count: cart[id], price: p.price };
            });

            const orderData = {
                customer: { name, phone, address },
                items: items,
                total: items.reduce((acc, item) => acc + (item.price * item.count), 0),
                currency: "PLN"
            };

            tg.sendData(JSON.stringify(orderData));
        });

        renderProducts();
    </script>
</body>
</html>
