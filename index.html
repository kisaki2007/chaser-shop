<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CHAOS SHOP</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap');

    :root {
      --bg-color: #0b0b0d;
      --card-bg: #131316;
      --border-color: #232328;
      --accent-yellow: #f2c94c;
      --accent-yellow-glow: rgba(242, 201, 76, 0.35);
      --text-white: #ffffff;
      --text-gray: #8d8d95;
      --green-stock: #1b382b;
      --green-text: #27ae60;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      /* Оригинальный сетчатый фон */
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text-white);
      padding: 16px;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* ВСПЛЫВАЮЩЕЕ ОКНО D&N */
    #welcome-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(11, 11, 13, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    .welcome-box {
      background: #151518;
      border: 1px solid var(--accent-yellow);
      box-shadow: 0 0 25px var(--accent-yellow-glow);
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      max-width: 320px;
      width: 90%;
    }

    .welcome-initials {
      font-family: 'Georgia', serif;
      font-size: 56px;
      font-weight: 700;
      color: var(--accent-yellow);
      text-shadow: 0 0 12px var(--accent-yellow-glow);
      margin-bottom: 5px;
    }

    .welcome-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--text-white);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .welcome-desc {
      font-size: 13px;
      color: var(--text-gray);
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .btn-welcome {
      width: 100%;
      background: var(--accent-yellow);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 4px 15px var(--accent-yellow-glow);
    }

    /* ШАПКА */
    header {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    .shop-title {
      font-size: 32px;
      font-weight: 900;
      color: var(--accent-yellow);
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 15px var(--accent-yellow-glow);
    }

    /* ТАБЫ */
    .tabs-container {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-gray);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent-yellow);
      color: #000000;
      border-color: var(--accent-yellow);
      box-shadow: 0 0 15px var(--accent-yellow-glow);
    }

    /* КАТАЛОГ */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .img-box {
      width: 100%;
      height: 125px;
      border-radius: 14px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 10px;
      padding: 6px;
    }

    .img-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .stock-tag {
      background: var(--green-stock);
      color: #2ecc71;
      border: 1px solid rgba(46, 204, 113, 0.3);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .product-name {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 4px;
      color: var(--text-white);
      line-height: 1.2;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-price {
      font-size: 16px;
      font-weight: 900;
      color: var(--accent-yellow);
      margin-bottom: 10px;
    }

    .btn-buy {
      width: 100%;
      background: var(--accent-yellow);
      color: #000000;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .btn-buy:active {
      transform: scale(0.97);
    }

    /* КОРЗИНА */
    #cart-screen {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 20px;
    }

    .cart-title {
      text-align: center;
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 20px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .cart-item-info .name {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .cart-item-info .price {
      font-size: 14px;
      font-weight: 800;
      color: var(--accent-yellow);
    }

    .qty-picker {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-qty {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--accent-yellow);
      background: transparent;
      color: var(--accent-yellow);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-num {
      font-size: 15px;
      font-weight: 800;
    }

    .cart-divider {
      border-top: 1px dashed var(--border-color);
      margin: 20px 0;
    }

    .cart-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 20px;
    }

    .cart-total-row .val {
      color: var(--accent-yellow);
    }

    .btn-checkout {
      width: 100%;
      background: var(--accent-yellow);
      color: #000000;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 15px var(--accent-yellow-glow);
    }

    .empty-msg {
      text-align: center;
      color: var(--text-gray);
      padding: 30px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- ВСПЛЫВАЮЩЕЕ ОКНО D&N -->
  <div id="welcome-modal">
    <div class="welcome-box">
      <div class="welcome-initials">D&N</div>
      <div class="welcome-title">CHAOS SHOP</div>
      <div class="welcome-desc">Добро пожаловать в официальный каталог.</div>
      <button class="btn-welcome" onclick="closeWelcome()">ВОЙТИ В МАГАЗИН</button>
    </div>
  </div>

  <!-- ШАПКА -->
  <header>
    <h1 class="shop-title">CHAOS SHOP</h1>
  </header>

  <!-- ВКЛАДКИ -->
  <div class="tabs-container">
    <button class="tab-btn active" id="btn-tab-catalog" onclick="switchTab('catalog')">Каталог</button>
    <button class="tab-btn" id="btn-tab-cart" onclick="switchTab('cart')">Корзина (0)</button>
  </div>

  <!-- КАТАЛОГ -->
  <div id="catalog-screen">
    <div class="catalog-grid" id="catalog-grid"></div>
  </div>

  <!-- КОРЗИНА -->
  <div id="cart-screen">
    <div class="cart-title">Ваша корзина</div>
    <div id="cart-list"></div>
    <div class="cart-divider"></div>
    <div class="cart-total-row">
      <span>Итого:</span>
      <span class="val" id="total-val">0 PLN</span>
    </div>
    <button class="btn-checkout" onclick="checkout()">ОФОРМИТЬ ЗАКАЗ 🚀</button>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    function closeWelcome() {
      const modal = document.getElementById('welcome-modal');
      modal.style.opacity = '0';
      setTimeout(() => { modal.style.display = 'none'; }, 400);
    }

    // ВСЕ 10 ТОВАРОВ CHAOS / CHASER С ПРЯМЫМИ КАРТИНКАМИ
    const products = [
      { id: 1, name: "Chaser Mint", price: 60, stock: 4, img: "https://chaser.com.ua/images/stories/virtuemart/product/chaser-for-pods-mint.png" },
      { id: 2, name: "Chaser Grape Plus", price: 60, stock: 3, img: "https://chaser.com.ua/images/stories/virtuemart/product/chaser-for-pods-grape.png" },
      { id: 3, name: "Chaser Watermelon", price: 60, stock: 5, img: "https://chaser.com.ua/images/stories/virtuemart/product/chaser-for-pods-watermelon.png" },
      { id: 4, name: "Chaser Raspberry", price: 60, stock: 2, img: "https://chaser.com.ua/images/stories/virtuemart/product/chaser-for-pods-raspberry.png" },
      { id: 5, name: "Chaser Mango", price: 60, stock: 4, img: "https://chaser.com.ua/images/stories/virtuemart/product/chaser-for-pods-mango.png" },
      { id: 6, name: "Chaser Apple", price: 60, stock: 3, img: "https://chaser.com.ua/images/stories/virtuemart/product/chaser-for-pods-apple.png" },
      { id: 7, name: "Chaser Blueberry", price: 60, stock: 4, img: "https://chaser.com.ua/images/stories/virtuemart/product/chaser-for-pods-blueberry.png" },
      { id: 8, name: "Chaser Peach", price: 60, stock: 3, img: "https://chaser.com.ua/images/stories/virtuemart/product/chaser-for-pods-peach.png" },
      { id: 9, name: "Chaser Strawberry", price: 60, stock: 5, img: "https://chaser.com.ua/images/stories/virtuemart/product/chaser-for-pods-strawberry.png" },
      { id: 10, name: "Chaser Cherry", price: 60, stock: 2, img: "https://chaser.com.ua/images/stories/virtuemart/product/chaser-for-pods-cherry.png" }
    ];

    let cart = {};

    function renderCatalog() {
      const grid = document.getElementById('catalog-grid');
      grid.innerHTML = '';
      products.forEach(p => {
        grid.innerHTML += `
          <div class="product-card">
            <div class="img-box">
              <img src="${p.img}" alt="${p.name}" onerror="this.onerror=null; this.src='https://chaserlab.com.ua/image/cache/catalog/chaser-for-pods/mint-500x500.png';">
            </div>
            <div class="stock-tag">${p.stock} шт в наличии ✅</div>
            <div class="product-name">${p.name}</div>
            <div class="product-price">${p.price} PLN</div>
            <button class="btn-buy" onclick="addToCart(${p.id})">В КОРЗИНУ</button>
          </div>
        `;
      });
    }

    function switchTab(tab) {
      const catBtn = document.getElementById('btn-tab-catalog');
      const cartBtn = document.getElementById('btn-tab-cart');
      const catScreen = document.getElementById('catalog-screen');
      const cartScreen = document.getElementById('cart-screen');

      if (tab === 'catalog') {
        catBtn.classList.add('active');
        cartBtn.classList.remove('active');
        catScreen.style.display = 'block';
        cartScreen.style.display = 'none';
      } else {
        cartBtn.classList.add('active');
        catBtn.classList.remove('active');
        catScreen.style.display = 'none';
        cartScreen.style.display = 'block';
        renderCart();
      }
    }

    function addToCart(id) {
      if (cart[id]) {
        cart[id].qty += 1;
      } else {
        const item = products.find(p => p.id === id);
        cart[id] = { ...item, qty: 1 };
      }
      updateCartCount();
    }

    function changeQty(id, delta) {
      if (cart[id]) {
        cart[id].qty += delta;
        if (cart[id].qty <= 0) delete cart[id];
      }
      updateCartCount();
      renderCart();
    }

    function updateCartCount() {
      const totalQty = Object.values(cart).reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('btn-tab-cart').innerText = `Корзина (${totalQty})`;
    }

    function renderCart() {
      const list = document.getElementById('cart-list');
      const totalVal = document.getElementById('total-val');
      const keys = Object.keys(cart);

      if (keys.length === 0) {
        list.innerHTML = '<div class="empty-msg">Ваша корзина пуста</div>';
        totalVal.innerText = '0 PLN';
        return;
      }

      list.innerHTML = '';
      let total = 0;

      keys.forEach(id => {
        const item = cart[id];
        const itemTotal = item.price * item.qty;
        total += itemTotal;

        list.innerHTML += `
          <div class="cart-item">
            <div class="cart-item-info">
              <div class="name">${item.name}</div>
              <div class="price">${item.price} PLN</div>
            </div>
            <div class="qty-picker">
              <button class="btn-qty" onclick="changeQty(${id}, -1)">-</button>
              <span class="qty-num">${item.qty}</span>
              <button class="btn-qty" onclick="changeQty(${id}, 1)">+</button>
            </div>
          </div>
        `;
      });

      totalVal.innerText = `${total} PLN`;
    }

    function checkout() {
      const itemsArray = Object.values(cart);
      if (itemsArray.length === 0) {
        alert("Добавьте хотя бы один товар!");
        return;
      }

      const totalSum = itemsArray.reduce((sum, i) => sum + i.price * i.qty, 0);
      const data = {
        items: itemsArray.map(i => ({ name: i.name, qty: i.qty, price: i.price })),
        total: totalSum
      };

      if (tg) {
        tg.sendData(JSON.stringify(data));
        tg.close();
      } else {
        alert(`Заказ оформлен на сумму ${totalSum} PLN!`);
      }
    }

    renderCatalog();
  </script>
</body>
</html>
