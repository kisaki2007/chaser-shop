<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaos Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/pricedown" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0d0f;
            color: #ffffff;
            padding: 20px 16px 90px 16px;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 38px;
            font-weight: 400;
            font-family: 'Pricedown Bl', 'Pricedown', sans-serif;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            text-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .product-card {
            background: linear-gradient(145deg, #18181f, #111116);
            border-radius: 18px;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .product-card:active {
            transform: scale(0.98);
            border-color: #ffd700;
        }

        .img-container {
            width: 100%;
            height: 130px;
            background: #ffffff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            padding: 8px;
        }

        .product-card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .product-card h3 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
            line-height: 1.2;
        }

        .product-card .desc {
            font-size: 11px;
            color: #a0a0b0;
            line-height: 1.4;
            margin-bottom: 12px;
            flex-grow: 1;
            font-weight: 400;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-card .price {
            font-weight: 800;
            color: #ffd700;
            font-size: 16px;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.25);
        }

        .btn-add {
            width: 100%;
            background: linear-gradient(135deg, #ffd700 0%, #d4af37 100%);
            color: #000000;
            border: none;
            padding: 10px 0;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.25);
        }

        .btn-add:active {
            transform: scale(0.96);
            opacity: 0.9;
        }

        .cart-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 400px;
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
            color: #000000;
            padding: 14px 20px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 15px;
            display: none;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.4);
            cursor: pointer;
            z-index: 1000;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(24, 24, 31, 0.95);
            border: 1px solid #ffd700;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 2000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            padding: 20px;
        }

        .modal-card {
            background: #18181f;
            border: 1px solid #ffd700;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            padding: 24px 20px;
            position: relative;
            box-shadow: 0 10px 35px rgba(255, 215, 0, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 24px;
            color: #888;
            cursor: pointer;
            font-weight: bold;
        }

        .modal-img-container {
            width: 100%;
            height: 200px;
            background: #ffffff;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            padding: 12px;
        }

        .modal-img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .modal-card h2 {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .modal-card .modal-desc {
            font-size: 13px;
            color: #a0a0b0;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .modal-card .modal-price {
            font-size: 20px;
            font-weight: 800;
            color: #ffd700;
            margin-bottom: 16px;
        }

        .welcome-card {
            background: linear-gradient(145deg, #1c1c24, #121217);
            border: 1px solid rgba(255, 215, 0, 0.4);
        }

        .welcome-title {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .welcome-text {
            font-size: 14px;
            color: #c0c0d0;
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .creators-tag {
            background: rgba(255, 215, 0, 0.1);
            border: 1px dashed #ffd700;
            border-radius: 12px;
            padding: 8px 16px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #ffd700;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Стиль формы доставки */
        .form-group {
            width: 100%;
            text-align: left;
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #ffd700;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            background: #0f0f13;
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            padding: 12px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .form-input:focus {
            border-color: #ffd700;
        }
    </style>
</head>
<body>

    <h1>Chaos Shop</h1>

    <div id="products-container" class="products-grid"></div>

    <div id="cart-bar" class="cart-bar" onclick="openDeliveryModal()">
        <span>Оформить заказ (<span id="cart-count">0</span>)</span>
        <span id="cart-total">0 PLN</span>
    </div>

    <div id="toast" class="toast">
        Спасибо за покупку! 💖(⁠ ⁠•⁠ ⁠¾⁠ ⁠•⁠ ⁠)
    </div>

    <!-- Приветствие -->
    <div id="welcome-modal" class="modal-overlay" style="display: flex;">
        <div class="modal-card welcome-card">
            <h2 class="welcome-title">Приветствуем! ✨</h2>
            <p class="welcome-text">
                Добро пожаловать в <b>Chaos Shop</b>!<br>
                Желаем приятных покупок и отличного настроения.
            </p>
            <div class="creators-tag">
                Made with love by <span>D & N</span> 🖤
            </div>
            <button onclick="closeWelcomeModal()" class="btn-add">Войти в магазин ♡</button>
        </div>
    </div>

    <!-- Просмотр товара -->
    <div id="product-modal" class="modal-overlay" onclick="closeModal(event, 'product-modal')">
        <div class="modal-card" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeModal(null, 'product-modal')">&times;</span>
            <div class="modal-img-container">
                <img id="modal-img" src="" alt="">
            </div>
            <h2 id="modal-title"></h2>
            <p id="modal-desc" class="modal-desc"></p>
            <p id="modal-price" class="modal-price"></p>
            <button id="modal-btn" class="btn-add">Добавить в корзину</button>
        </div>
    </div>

    <!-- Форма доставки -->
    <div id="delivery-modal" class="modal-overlay" onclick="closeModal(event, 'delivery-modal')">
        <div class="modal-card" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeModal(null, 'delivery-modal')">&times;</span>
            <h2>Данные для доставки 📦</h2>
            <p class="modal-desc" style="margin-bottom: 20px;">Заполните поля, чтобы мы смогли отправить ваш заказ:</p>
            
            <div class="form-group">
                <label>Имя и Фамилия</label>
                <input type="text" id="cust-name" class="form-input" placeholder="Иван Иванов">
            </div>
            <div class="form-group">
                <label>Номер телефона</label>
                <input type="tel" id="cust-phone" class="form-input" placeholder="+48 000 000 000">
            </div>
            <div class="form-group">
                <label>Город и адрес / Пачкомат</label>
                <input type="text" id="cust-address" class="form-input" placeholder="Варшава, InPost WAW01M">
            </div>

            <button onclick="submitOrder()" class="btn-add" style="margin-top: 10px;">Подтвердить заказ 🚀</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp || null;

        const products = [
            {
                id: 1,
                name: "Chaser Mint",
                price: 60,
                volume: "30ml",
                img: "mint.jpg",
                description: "Освежающий, чистый и бодрящий вкус перечной мяты. Идеальная прохлада для ежедневного парения."
            },
            {
                id: 2,
                name: "Chaser Grape Plus",
                price: 60,
                volume: "30ml",
                img: "grape_plus.jpg?v=5",
                description: "Насыщенный вкус сочного тёмного винограда с усиленной ароматикой. Настоящая ягодная феерия."
            },
            {
                id: 3,
                name: "Chaser Pineapple",
                price: 60,
                volume: "30ml",
                img: "pineapple.jpg",
                description: "Яркий и сладкий тропический ананас с лёгкой приятной кислинкой сочной мякоти."
            },
            {
                id: 4,
                name: "Chaser Energy Cherry",
                price: 60,
                volume: "30ml",
                img: "energy_cherry.jpg",
                description: "Мощный тонизирующий микс бодрящего энергетика и спелой вишни."
            },
            {
                id: 5,
                name: "Chaser Lux Tropic Punch",
                price: 60,
                volume: "30ml",
                img: "tropic_punch.jpg",
                description: "Экзотический тропический пунш из линейки Lux Balance — гармоничное сочетание сочного манго и спелых цитрусов."
            },
            {
                id: 6,
                name: "Chaser Lux Blueberry Mint",
                price: 60,
                volume: "30ml",
                img: "blueberry_mint.jpg",
                description: "Премиальный микс спелой лесной черники и прохладных листочков свежей мяты."
            },
            {
                id: 7,
                name: "Chaser Triple Raspberry",
                price: 60,
                volume: "30ml",
                img: "triple_raspberry.jpg",
                description: "Уникальное сочетание трёх сортов малины: красной, жёлтой и синей."
            },
            {
                id: 8,
                name: "Chaser Pink Lemonade",
                price: 60,
                volume: "30ml",
                img: "pink_lemonade.jpg",
                description: "Классический розовый лимонад из сладкой малины и освежающего лимона со льдом."
            }
        ];

        let cart = [];

        function renderProducts() {
            const container = document.getElementById('products-container');
            if (!container) return;

            container.innerHTML = products.map(product => `
                <div class="product-card" onclick="openModal(${product.id})">
                    <div class="img-container">
                        <img src="${product.img}" alt="${product.name}" onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/kisaki2007/chaser-shop/main/watermelon.jpg';">
                    </div>
                    <h3>${product.name}</h3>
                    <p class="desc">${product.description}</p>
                    <p class="price">${product.price} PLN</p>
                    <button onclick="event.stopPropagation(); addToCart(${product.id})" class="btn-add">Добавить в корзину</button>
                </div>
            `).join('');
        }

        function closeWelcomeModal() {
            document.getElementById('welcome-modal').style.display = 'none';
        }

        function openModal(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            document.getElementById('modal-img').src = product.img;
            document.getElementById('modal-title').innerText = product.name;
            document.getElementById('modal-desc').innerText = product.description;
            document.getElementById('modal-price').innerText = `${product.price} PLN`;
            
            const btn = document.getElementById('modal-btn');
            btn.onclick = () => {
                addToCart(product.id);
                closeModal(null, 'product-modal');
            };

            document.getElementById('product-modal').style.display = 'flex';
        }

        function openDeliveryModal() {
            if (cart.length === 0) return;
            document.getElementById('delivery-modal').style.display = 'flex';
        }

        function closeModal(event, modalId) {
            if (!event || event.target.classList.contains('modal-overlay') || event.target.classList.contains('modal-close')) {
                document.getElementById(modalId).style.display = 'none';
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function addToCart(productId) {
            const item = products.find(p => p.id === productId);
            if (item) {
                cart.push(item);
                updateCartUI();
                showToast();
            }
        }

        function updateCartUI() {
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            const count = cart.length;

            if (tg && tg.MainButton) {
                if (count > 0) {
                    tg.MainButton.setText(`Перейти к оформлению (${count}) • ${total} PLN`);
                    tg.MainButton.setParams({
                        color: '#ffd700',
                        text_color: '#000000'
                    });
                    tg.MainButton.show();
                } else {
                    tg.MainButton.hide();
                }
            } else {
                const cartBar = document.getElementById('cart-bar');
                if (count > 0) {
                    document.getElementById('cart-count').innerText = count;
                    document.getElementById('cart-total').innerText = `${total} PLN`;
                    cartBar.style.display = 'flex';
                } else {
                    cartBar.style.display = 'none';
                }
            }
        }

        function submitOrder() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const address = document.getElementById('cust-address').value.trim();

            if (!name || !phone || !address) {
                alert('Пожалуйста, заполните все поля для доставки!');
                return;
            }

            const orderData = {
                items: cart,
                customer: {
                    name: name,
                    phone: phone,
                    address: address
                },
                total: cart.reduce((sum, item) => sum + item.price, 0)
            };

            if (tg) {
                tg.sendData(JSON.stringify(orderData));
            } else {
                alert(`Заказ сформирован!\nПолучатель: ${name}\nТелефон: ${phone}\nАдрес: ${address}\nСумма: ${orderData.total} PLN`);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderProducts();

            if (tg) {
                try {
                    tg.ready();
                    tg.expand();
                    tg.onEvent('mainButtonClicked', openDeliveryModal);
                } catch (e) {
                    console.log("Запущено вне Telegram", e);
                }
            }
        });
    </script>
</body>
</html>
